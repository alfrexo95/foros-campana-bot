name: Publicar Campaña en Foros

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write # Necesario para guardar el progreso

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: pip install requests
        
      - name: Ejecutar Bot de Foros
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python bot_foros.py

      - name: Guardar Estado de la Imagen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Siguiente imagen en cola"
          file_pattern: 'state.json'
